<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="{{ '/' | relative_url }}">
      <span class="site-logo__mark">{% include compass.html class="icon-compass" %}</span>
      <span class="site-logo__text">{{ site.title }}</span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/travel/' | relative_url }}" class="{% if page.url contains '/travel' %}is-active{% endif %}">Travel</a>
      <a href="{{ '/opinion/' | relative_url }}" class="{% if page.url contains '/opinion' %}is-active{% endif %}">Opinion</a>
      <a href="{{ '/tech/' | relative_url }}" class="{% if page.url contains '/tech' %}is-active{% endif %}">Tech</a>
      <a href="{{ '/photos/' | relative_url }}" class="{% if page.url contains '/photos' %}is-active{% endif %}">Photos</a>
      <a href="{{ '/about/' | relative_url }}" class="{% if page.url contains '/about' %}is-active{% endif %}">About</a>
    </nav>

    <button class="theme-toggle" type="button" aria-label="Toggle dark mode" data-theme-toggle>
      <span class="theme-toggle__icon">◐</span>
    </button>
  </div>
</header>
